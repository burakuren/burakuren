<g><animate attributeName="opacity" dur="3.8s" fill="freeze" values="0;0;1;1" keyTimes="0;0.4605;0.5789;1"/>
<text x="40" y="282" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#f2f3f5">I build the parts of a web product you don't see, and keep them running.</text>
</g>
<g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#9198a4"><animate attributeName="opacity" dur="3.8s" fill="freeze" values="0;0;1;1" keyTimes="0;0.6053;0.7237;1"/>
<text x="40" y="322">I got into backend work by building my own product. In 2021 I launched</text>
<text x="40" y="349">BanaDersBul to connect private tutors with students, and I've run it end</text>
<text x="40" y="376">to end ever since: the API, the database, the servers and every deploy.</text>
</g>
