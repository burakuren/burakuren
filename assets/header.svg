<rect x="40" y="190" width="132" height="3" rx="1.5" fill="#97c58e"/>
<text x="40" y="226" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17"><tspan fill="#e2b466">Backend Engineer</tspan><tspan fill="#9198a4">  ·  Python  ·  Django  ·  PostgreSQL  ·  Linux</tspan></text>
